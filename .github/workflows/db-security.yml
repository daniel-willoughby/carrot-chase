name: db-security

# Database authorisation guard.
#
# Runs the fast, deterministic static tripwire that flags any SECURITY DEFINER
# function which authorises on role alone (is_school_admin()) without an
# organisation check — the bug class fixed in migration 0010.
#
# The behavioural cross-org tests (supabase/tests/rls_cross_org.sql) are run
# against a real database rather than here: faithfully reconstructing the
# Supabase platform (auth schema, roles, extensions, the auth.users FK) on a
# vanilla Postgres is brittle, so those tests run locally / pre-deploy via:
#     supabase db query --linked --file supabase/tests/rls_cross_org.sql
# (rolled back, non-destructive). See docs/SECURITY.md.

on:
  push:
    paths:
      - "supabase/migrations/**"
      - "scripts/check-definer-authz.sh"
      - ".github/workflows/db-security.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/check-definer-authz.sh"
      - ".github/workflows/db-security.yml"

jobs:
  tripwire:
    name: Static definer-authz tripwire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-definer-authz.sh
