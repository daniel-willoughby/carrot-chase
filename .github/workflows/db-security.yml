name: db-security

# Database authorisation guards.
#
#   tripwire   — fast static check (no DB) flagging any SECURITY DEFINER
#                function that authorises on role alone (is_school_admin())
#                without an organisation check. The bug class fixed in 0010.
#   sql-tests  — behavioural cross-org regression tests, run against a REAL
#                Supabase Postgres (via the Supabase CLI), which provides the
#                auth schema, auth.uid(), roles and extensions the migrations
#                depend on. Avoids hand-stubbing the platform on vanilla PG.
#
# See docs/SECURITY.md.

on:
  push:
    paths:
      - "supabase/**"
      - "scripts/check-definer-authz.sh"
      - ".github/workflows/db-security.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/check-definer-authz.sh"
      - ".github/workflows/db-security.yml"

jobs:
  tripwire:
    name: Static definer-authz tripwire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-definer-authz.sh

  sql-tests:
    name: Cross-org authorisation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts the local Supabase Postgres and applies every migration in
      # supabase/migrations. The real Supabase image ships the auth schema,
      # auth.uid(), the authenticated/anon/service_role roles and the
      # pgcrypto/uuid-ossp extensions, so the migrations apply natively.
      - name: Start local stack (applies migrations)
        run: supabase start

      # Behavioural regression: an Org A admin must NOT be able to commit
      # results / add late arrivals for Org B; same-org calls must succeed.
      # Fixtures are rolled back (non-destructive).
      - name: Run cross-org authorisation tests
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls_cross_org.sql

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
